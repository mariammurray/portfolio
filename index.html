<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#6d0503">
  <title>The Resume &amp; Cover Letter</title>
  <link rel="icon" type="image/svg+xml" sizes="48x48" href="./assets/favicon-48.svg">
  <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg">
  <link rel="apple-touch-icon" href="./assets/favicon.svg">
  <meta property="og:type" content="website">
  <meta property="og:title" content="The Resume &amp; Cover Letter | Maria Murray">
  <meta property="og:description" content="Pull up a stool and learn more about me.">
  <meta property="og:url" content="https://mariammurray.github.io/portfolio/">
  <meta property="og:image" content="https://mariammurray.github.io/portfolio/og.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="A pub sign reading The Resume &amp; Cover Letter on a snowy winter background">
  <meta name="twitter:card" content="summary_large_image">
</head>
<body>
  <div id="stage" aria-hidden="true">
    <div id="scene">
      <div class="pic">
        <img id="bg" alt="">
        <canvas id="scene-snow"></canvas>
      </div>
      <div id="near">
      <img id="indoor" alt="">
      <img class="lit" id="indoor-lit" alt="">
      <div class="light soft fixed"><i></i></div>
      <div class="light soft"><i></i></div>
      <div class="light lift"><i></i></div>
      <div id="hollywrap">
        <img id="holly" alt="" hidden>
        <img class="lit" id="holly-lit" alt="">
        <div class="light soft hl fixed"><i></i></div>
        <div class="light soft hl"><i></i></div>
        <div class="light lift hl"><i></i></div>
      </div>
      <img id="wine" alt="">
      <img class="steam s1" alt="" hidden>
      <img class="steam s2" alt="" hidden>
      <canvas id="flames" width="1200" height="675"></canvas>
      </div>
    </div>
  </div>
  <aside id="menu" aria-label="Portfolio menu" hidden></aside>
  <button id="sound" type="button" hidden aria-pressed="false" aria-label="Mute ambient sound">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path class="spk" d="M3 9v6h4l5 4V5L7 9z"/><path class="wave" d="M15.5 8.5a5 5 0 0 1 0 7M18 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path class="slash" d="M4 4l16 16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
  </button>
  <div id="loader">
    <div class="wash"></div>
    <canvas id="loader-snow"></canvas>
    <div class="copy">
      <h1 class="sr-only">Welcome to The Resume &amp; Cover Letter</h1>
      <img src="./assets/pub-sign.webp" alt="">
      <button id="enter-pub" type="button" disabled aria-label="Opening the pub">
        <span id="entry-label" aria-live="polite">Just opening up...</span><span id="entry-arrow" class="arrow" aria-hidden="true" hidden>↓</span>
      </button>
    </div>
  </div>
  <script>
    // Plain (non-module) script so it still runs if the app bundle fails to load.
    (function () {
      var fail = function () {
        var l = document.getElementById('entry-label')
        if (l && l.textContent === 'Just opening up...') l.textContent = 'Sorry, something went wrong. Please reload the page.'
      }
      addEventListener('error', fail)
      addEventListener('unhandledrejection', fail)
    })()
  </script>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
