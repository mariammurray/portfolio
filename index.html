      <h1>Maria Murray: Frontend Engineer (React, TypeScript)</h1>
      <p>Founding frontend engineer who builds customer-facing products, API integrations and data pipelines. Welcome to The Resume &amp; Cover Letter, a portfolio of work and projects.</p>

      <h2>Work</h2>
      <h3><a href="https://galactik.grnx.app/">GRN X Ltd</a> — Founding Developer (Contract), since June 2025</h3>
      <p>One of two founding developers, Maria built the React and TypeScript frontend of a web platform for a pre-launch startup, including marketplace flows, project tracking, user portfolios and chat groups. She integrated Stripe payments, Mapbox and two internal REST APIs.</p>

      <h2>Projects</h2>
      <ul>
        <li><a href="https://mariammurray.github.io/WSL-Fantasy-Stats/">WSL Fantasy Stats</a>: an auto-updating Women's Super League fantasy football dashboard built from official-site data, with weekly data snapshots automated using GitHub Actions.</li>
        <li><a href="https://mariammurray.github.io/whoprobablywroteonit/">Who Probably Wrote On It</a>: a Spotify API app that analyses One Direction writing credits to identify which member's songs a user likes best.</li>
        <li><a href="https://github.com/mariammurray/settleUp">SettleUp</a>: a full-stack social sports betting prototype built with React, Tailwind CSS, Node.js, Express and Socket.IO, with live room updates and odds tracking over WebSockets.</li>
        <li><a href="https://mariammurray.github.io/caldeira-media/">Caldeira Media</a>: an accessible, motion-based landing page for a fictional film production company, with hand-masked image layers animated independently.</li>
      </ul>

      <h2>More experience</h2>
